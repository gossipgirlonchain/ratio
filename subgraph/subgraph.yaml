specVersion: 1.0.0
description: >
  ratio — head-to-head prediction markets on tweets, settled by likes.
  Indexes Doppler's PredictionMigrator, the DopplerHookInitializer's swaps, and
  ratio's own per-market oracles on Base Sepolia.
repository: https://github.com/gossipgirlonchain/ratio
schema:
  file: ./schema.graphql

dataSources:
  # Ratio's oracle factory. Each market deploys a minimal-proxy oracle, so this
  # is also where the dynamic RatioOracle template gets instantiated from.
  - kind: ethereum
    name: RatioOracleFactory
    network: base-sepolia
    source:
      address: "0xCFeBFF30bf95E9bD5EEBBA7cD6c78c5764d090Dd"
      abi: RatioOracleFactory
      startBlock: 46488000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities: [Market, Protocol]
      abis:
        - name: RatioOracleFactory
          file: ./abis/RatioOracleFactory.json
      eventHandlers:
        - event: OracleCreated(indexed uint256,indexed address,uint64)
          handler: handleOracleCreated

  # Doppler's PredictionMigrator. Deployed Feb 2026, unused until ratio — see
  # contracts/BASE-SEPOLIA.md.
  - kind: ethereum
    name: PredictionMigrator
    network: base-sepolia
    source:
      address: "0x91aad599EfD70E633d091FC060cc6f9D3e5298BE"
      abi: PredictionMigrator
      startBlock: 46488000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/migrator.ts
      entities: [Market, Entry, Claim, Position, User, Protocol]
      abis:
        - name: PredictionMigrator
          file: ./abis/PredictionMigrator.json
      eventHandlers:
        - event: EntryRegistered(indexed address,indexed bytes32,address,address)
          handler: handleEntryRegistered
        - event: EntryMigrated(indexed address,indexed bytes32,address,uint256,uint256)
          handler: handleEntryMigrated
        - event: Claimed(indexed address,indexed address,uint256,uint256)
          handler: handleClaimed

  # Where trades live.
  #
  # The Uniswap v4 PoolManager, NOT the DopplerHookInitializer's own Swap.
  # The initializer's event carries an INDEXED PoolKey struct, and graph-node
  # cannot decode indexed tuples: it treats the tuple's first field as the
  # indexed one and then expects the remaining four in the log data, so it
  # looks for 11 data words, finds 7, and aborts the handler. That stalled the
  # first sync at the very first swap.
  #
  # PoolManager's Swap is all value types, and its `id` IS the poolId we key
  # on. It is a singleton, so every v4 swap on the chain arrives here and the
  # handler drops the ones whose pool is not one of ours.
  - kind: ethereum
    name: PoolManager
    network: base-sepolia
    source:
      address: "0x05E73354cFDd6745C338b50BcFDfA3Aa6fA03408"
      abi: PoolManager
      startBlock: 46488000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/swaps.ts
      entities: [Market, Entry, Trade, Position, User, Protocol]
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap

templates:
  # One oracle per market, so it has to be dynamic — the addresses do not exist
  # until a market opens.
  - kind: ethereum
    name: RatioOracle
    network: base-sepolia
    source:
      abi: RatioOracle
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/oracle.ts
      entities: [Market]
      abis:
        - name: RatioOracle
          file: ./abis/RatioOracle.json
      eventHandlers:
        - event: MarketOpened(indexed address,indexed uint256,indexed address,uint64)
          handler: handleMarketOpened
        - event: EntryTokensSet(indexed address,address,address)
          handler: handleEntryTokensSet
        - event: RatioResolved(indexed address,indexed uint256,uint8,uint256,uint256,bool)
          handler: handleRatioResolved
